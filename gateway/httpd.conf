# Standalone local API gateway. Start with gateway.ps1; no XAMPP config edits.
ServerRoot "${APACHE_ROOT}"
Listen 127.0.0.1:8000
ServerName localhost:8000
PidFile "${GATEWAY_ROOT}/runtime/httpd.pid"
ErrorLog "${GATEWAY_ROOT}/runtime/error.log"
LogLevel warn
ServerTokens Prod
ServerSignature Off

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

# Never expose repository files or act as a forward proxy.
DocumentRoot "${GATEWAY_ROOT}/public"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 60
# Deliberately omit query strings, cookies and Authorization from access logs.
LogFormat "%h %t %m %U %>s %b" gateway
CustomLog "${GATEWAY_ROOT}/runtime/access.log" gateway

# Services verify the original Bearer token; never trust caller-supplied identity.
RequestHeader unset X-User-Id
RequestHeader unset X-User-Role
RequestHeader unset X-User-Name
RequestHeader unset X-Department-Id
RequestHeader unset X-Forwarded-Host
RequestHeader unset X-Forwarded-For
RequestHeader set X-Forwarded-Proto "http"

# Optional frontend from the architecture guide. Blade does not need port 3000.
SetEnvIf Origin "^http://(localhost|127\.0\.0\.1):3000$" cors_origin=$0
Header onsuccess unset Access-Control-Allow-Origin
Header always unset Access-Control-Allow-Origin
Header onsuccess unset Access-Control-Allow-Credentials
Header always unset Access-Control-Allow-Credentials
Header always set Access-Control-Allow-Origin "%{cors_origin}e" env=cors_origin
Header always merge Vary "Origin"
Header always set Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" env=cors_origin
Header always set Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" env=cors_origin
Header always set Access-Control-Expose-Headers "Content-Disposition" env=cors_origin

RewriteEngine On
RewriteCond %{REQUEST_METHOD} =OPTIONS
RewriteRule ^/?api(?:/|$) - [R=204,L]

# Keep the login page on its original origin so existing SSO/localStorage works.
RewriteRule ^/?$ http://localhost:8001/ [R=302,L]

# Module 1: preserve the real v1 routes; accept the guide's /api/auth alias.
RewriteRule ^/?api/auth(/.*)?$ http://127.0.0.1:8001/api/v1/auth$1 [P,L]
RewriteRule ^/?api/(v1/(?:auth|profile|admin|directory)(?:/.*)?)$ http://127.0.0.1:8001/api/$1 [P,L]
# Module 2: catalog and organization.
RewriteRule ^/?api/((?:catalog|departments|support-types|staff-candidates|faqs)(?:/.*)?)$ http://127.0.0.1:8002/api/$1 [P,L]
# Module 3 owns tickets, even though module 1 still has legacy request routes.
RewriteRule ^/?api/((?:requests|sla|catalog-usage)(?:/.*)?)$ http://127.0.0.1:8003/api/$1 [P,L]
# Module 4: news and attached documents.
RewriteRule ^/?api/((?:news|admin/news)(?:/.*)?)$ http://127.0.0.1:8004/api/$1 [P,L]
# Module 5: reporting and ratings facade.
RewriteRule ^/?api/((?:reports|ratings)(?:/.*)?)$ http://127.0.0.1:8005/api/$1 [P,L]
# Unrecognized routes must not silently reach another service.
RewriteRule ^ - [R=404,L]

ProxyPassReverse / http://127.0.0.1:8001/
ProxyPassReverse / http://127.0.0.1:8002/
ProxyPassReverse / http://127.0.0.1:8003/
ProxyPassReverse / http://127.0.0.1:8004/
ProxyPassReverse / http://127.0.0.1:8005/
